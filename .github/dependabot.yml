version: 2
updates:
  # npm version updates are intentionally NOT handled here — the weekly
  # NCU_UPDATE workflow (workflows/ncu-update.ci.yml) already bundles all
  # npm dependencies into one PR (`ncu-update/deps`) and syncs badges.
  # Dependabot security updates are unaffected (they use default repo config).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(ci)"
